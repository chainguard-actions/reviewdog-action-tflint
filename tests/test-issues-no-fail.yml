name: Test lint issues with fail_level none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          working_directory: tests/fixtures/issues
          tflint_version: v0.53.0
          reporter: local
          filter_mode: nofilter
          level: warning
          fail_level: none
      - name: Assert issues found but step succeeded
        env:
          TFLINT_RC: ${{ steps.action.outputs.tflint-return-code }}
          REVIEWDOG_RC: ${{ steps.action.outputs.reviewdog-return-code }}
        run: |
          echo "tflint-return-code: $TFLINT_RC"
          echo "reviewdog-return-code: $REVIEWDOG_RC"
          if [ "$TFLINT_RC" != "2" ]; then
            echo "FAIL: expected tflint-return-code 2 (issues found)"
            exit 1
          fi
          if [ "$REVIEWDOG_RC" != "0" ]; then
            echo "FAIL: expected reviewdog-return-code 0 with fail_level none"
            exit 1
          fi
          echo "PASS"
