name: Test basic clean terraform (latest tflint)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          working_directory: tests/fixtures/clean
          reporter: local
          filter_mode: nofilter
      - name: Assert return codes are zero
        env:
          TFLINT_RC: ${{ steps.action.outputs.tflint-return-code }}
          REVIEWDOG_RC: ${{ steps.action.outputs.reviewdog-return-code }}
        run: |
          echo "tflint-return-code: $TFLINT_RC"
          echo "reviewdog-return-code: $REVIEWDOG_RC"
          if [ "$TFLINT_RC" != "0" ]; then
            echo "FAIL: expected tflint-return-code 0"
            exit 1
          fi
          if [ "$REVIEWDOG_RC" != "0" ]; then
            echo "FAIL: expected reviewdog-return-code 0"
            exit 1
          fi
          echo "PASS"
