name: Test lint issues with fail_level any fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          working_directory: tests/fixtures/issues
          tflint_version: v0.53.0
          reporter: local
          filter_mode: nofilter
          level: warning
          fail_level: any
      - name: Assert step failed due to findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REVIEWDOG_RC: ${{ steps.action.outputs.reviewdog-return-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "reviewdog-return-code: $REVIEWDOG_RC"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail with fail_level=any"
            exit 1
          fi
          if [ -n "$REVIEWDOG_RC" ] && [ "$REVIEWDOG_RC" = "0" ]; then
            echo "FAIL: reviewdog-return-code should be non-zero"
            exit 1
          fi
          echo "PASS"
